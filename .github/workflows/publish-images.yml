name: "Publish images"

# Same behaviour as NethServer/ns8-github-actions publish-branch.yml (build with
# build-images.sh, push <image>:<branch-or-tag>, and :latest for main and release
# tags), but the registry login uses the GHCR_TOKEN secret: the ghcr package of
# this module is user-owned and the repository GITHUB_TOKEN may not write to it.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  publish_images:
    name: "Publish module images"
    runs-on: ubuntu-latest
    env:
      REPOBASE: ghcr.io/${{ github.repository_owner }}
      IMAGETAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ui/node_modules
          key: "yarn-${{ hashFiles('ui/yarn.lock') }}"
      - id: build
        run: |
          REPOBASE=${REPOBASE,,}
          export REPOBASE
          IMAGETAG=$(printf '%s' "${IMAGETAG}" | tr '/' '-')
          export IMAGETAG
          echo "IMAGETAG=${IMAGETAG}" >> "$GITHUB_ENV"
          bash build-images.sh
      - id: publish
        run: |
          trap 'buildah logout ghcr.io' EXIT
          buildah login -u "${{ github.repository_owner }}" --password-stdin ghcr.io <<<"${{ secrets.GHCR_TOKEN }}"
          images=(${{ steps.build.outputs.images }})
          urls=""
          for image in "${images[@]}" ; do
            # runtime images built by build-images.sh may carry the tag already
            src="${image}"; buildah inspect "${image}:${IMAGETAG}" >/dev/null 2>&1 && src="${image}:${IMAGETAG}"
            buildah push "${src}" "docker://${image}:${IMAGETAG}"
            if [[ "${IMAGETAG}" == "main" || "${GITHUB_REF_TYPE}" == "tag" ]]; then
                buildah push "${src}" "docker://${image}:latest"
            fi
            urls="${image}:${IMAGETAG} "$'\n'"${urls}"
          done
          echo "::notice title=Image URLs::${urls}"

  test:
    name: "Test on QEMU"
    # Real NS8 nodes (Rocky 9 and Debian 13) on the GitHub runner, through
    # stephdl/ns8-ci-actions: clean install, update from the last release, backup
    # and restore (see tests/). Feature branches only: main and release tags
    # publish commits that were already tested on their branch, so testing them
    # again would only burn runner jobs. Run it by hand with workflow_dispatch.
    needs: publish_images
    if: ${{ github.event_name == 'workflow_dispatch' || (github.ref_type == 'branch' && github.ref_name != 'main') }}
    permissions:
      contents: read
      pull-requests: write
    uses: stephdl/ns8-ci-actions/.github/workflows/test-module-qemu.yml@v1
    with:
      # tests/10__install.robot branches on $SCENARIO
      scenarios: '["install","update"]'
      ui_tests_strategy: never
